name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Dependency audit
        # audit-level=critical, not high: @ducanh2912/next-pwa (latest, 10.2.9) pulls a
        # workbox-build chain with unresolved moderate/high advisories (serialize-javascript
        # RCE/DoS) and no patched release exists upstream as of 2026-09-17. workbox-build is
        # a build-time-only webpack plugin (service worker bundling), never shipped to the
        # browser. Revisit at high once next-pwa/workbox-build ships a fix.
        run: npm audit --audit-level=critical
      - name: Unit tests
        run: npm run test:run

  backend:
    name: Backend — pytest + AI evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values so app modules import cleanly in CI. No live services are
      # contacted: the DB engine is created lazily and the Anthropic client is
      # replaced by a deterministic stub in the eval suite.
      DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/test
      ANTHROPIC_API_KEY: ci-not-a-real-key
      SECRET_KEY: ci-secret
      NEXTAUTH_SECRET: ci-nextauth-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Dependency audit
        # PYSEC-2026-1325 (ecdsa, transitive via python-jose[cryptography]) is a
        # timing side-channel with no fix version — python-ecdsa's maintainers
        # have stated by policy they won't patch side-channel issues in pure
        # Python. Ignored here, not silently: revisit if ecdsa is ever dropped
        # in favor of a jose/JWT library that doesn't pull it in.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325
      - name: Unit tests + AI eval suite
        run: python -m pytest -ra
      - name: AI evals (one-command runner)
        run: python -m evals.run
