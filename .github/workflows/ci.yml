name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit

  backend:
    name: Backend — pytest + AI evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values so app modules import cleanly in CI. No live services are
      # contacted: the DB engine is created lazily and the Anthropic client is
      # replaced by a deterministic stub in the eval suite.
      DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/test
      ANTHROPIC_API_KEY: ci-not-a-real-key
      SECRET_KEY: ci-secret
      NEXTAUTH_SECRET: ci-nextauth-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Unit tests + AI eval suite
        run: python -m pytest -ra
      - name: AI evals (one-command runner)
        run: python -m evals.run
