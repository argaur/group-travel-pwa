  <!-- Map pin circle (hollow) -->
  <circle cx="256" cy="348" r="34" fill="url(#g)"/>
  <circle cx="256" cy="348" r="16" fill="#0f1222"/>

  <!-- Crossbar left endpoint dot -->
  <circle cx="128" cy="182" r="14" fill="url(#g)"/>

  <!-- Crossbar right endpoint dot -->
