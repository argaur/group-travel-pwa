<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a6b"/>
      <stop offset="100%" stop-color="#ff6b9a"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="#0f1222"/>

  <!-- T crossbar -->
  <rect x="128" y="168" width="256" height="28" rx="14" fill="url(#g)"/>

  <!-- T vertical stem (stops before pin) -->
